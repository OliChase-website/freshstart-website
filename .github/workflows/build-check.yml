name: Build check

# Cloudflare Pages builds and publishes the site itself on every push to main.
# This check runs the same build so a broken page or an SEO field that breaks
# the rules shows up as a red X on the commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
